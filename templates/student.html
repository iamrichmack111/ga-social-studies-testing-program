{% extends "base.html" %}{% block content %}<section class="form"><h1>Student Information</h1><form method="post"><label>Name<input name="name" required></label><label>Age<input name="age" type="number" min="5" max="19" required></label><label>Grade<select name="grade_level">{% for g in range(3,9) %}<option value="{{ g }}">{{ g }}</option>{% endfor %}</select></label><button>Continue</button></form></section>{% endblock %}

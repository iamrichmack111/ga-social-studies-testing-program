{% extends "base.html" %}{% block content %}<div class="status"><span>{{ theme.name }}</span><span>Question {{ test.current+1 }}/{{ test.total }}</span><span>Difficulty {{ test.diff }}</span></div>{% if feedback %}<div class="notice">{{ feedback }}</div>{% endif %}<section class="question"><h1>{{ test.question.prompt }}</h1><form method="post">{% for c in test.question.choices %}<label class="choice"><input type="radio" name="answer" value="{{ c }}" required>{{ c }}</label>{% endfor %}<button>Submit</button></form></section>{% endblock %}
